<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>School Store Inventory Scanner</title>
    
    <!-- Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Store Scanner">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Html5Qrcode library for barcode scanning -->
    <!-- Using a specific version for stability -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- Load FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        #reader {
            width: 100%;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            /* Important: Ensure the reader container has a defined minimum height */
            min-height: 250px; 
        }

        /* Override html5-qrcode default styling if necessary */
        #reader__dashboard_section_csr span {
            color: #374151; /* Tailwind gray-700 */
        }
        
        #reader__dashboard_section_swaplink {
            color: #3b82f6; /* Tailwind blue-500 */
            text-decoration: underline;
        }

        /* Styling for the toast notification */
        .toast {
            visibility: hidden;
            min-width: 250px;
            margin-left: -125px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            font-size: 17px;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s, visibility 0.3s;
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fas fa-store"></i> School Store Scanner
            <span id="cloud-status" class="ml-2 text-sm"><i class="fas fa-spinner fa-spin text-blue-300"></i></span>
        </h1>
        <div class="flex gap-2">
            <!-- Navigation buttons to toggle between Scanner and Inventory views -->
            <button id="nav-scanner" class="px-3 py-1 bg-blue-700 rounded-md hover:bg-blue-800 transition font-medium text-sm">
                <i class="fas fa-camera"></i> Scan
            </button>
            <button id="nav-inventory" class="px-3 py-1 bg-blue-500 rounded-md hover:bg-blue-700 transition font-medium text-sm">
                <i class="fas fa-boxes"></i> Inventory
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col p-4 max-w-3xl mx-auto w-full gap-4">
        
        <!-- View 1: Scanner Section -->
        <section id="view-scanner" class="flex flex-col gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-semibold mb-3 flex justify-between items-center text-gray-700">
                    <span><i class="fas fa-qrcode mr-2"></i>Scan Barcode</span>
                    <button id="toggle-camera-btn" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded border transition">
                        <i class="fas fa-play mr-1"></i> Start Camera
                    </button>
                </h2>
                
                <!-- The container where the camera feed will be rendered -->
                <div id="reader" class="mb-4"></div>
                
                <!-- Feedback area for recent scans -->
                <div id="scan-feedback" class="hidden bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg relative" role="alert">
                    <strong class="font-bold">Success!</strong>
                    <span class="block sm:inline" id="last-scanned-code"></span>
                </div>
            </div>

            <!-- Manual Entry Section (Fallback) -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-semibold mb-3 text-gray-700"><i class="fas fa-keyboard mr-2"></i>Manual Entry</h2>
                <form id="manual-add-form" class="flex gap-2">
                    <input type="text" id="manual-barcode" placeholder="Enter barcode / item name..." class="flex-grow p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
                        Add
                    </button>
                </form>
            </div>
        </section>

        <!-- View 2: Inventory Section -->
        <section id="view-inventory" class="hidden flex-col gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex-grow flex flex-col h-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-800"><i class="fas fa-clipboard-list mr-2"></i>Current Inventory</h2>
                    <div class="flex gap-2">
                        <button id="export-csv-btn" class="text-sm bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded transition shadow-sm flex items-center gap-1">
                            <i class="fas fa-download"></i> Export CSV
                        </button>
                        <button id="clear-all-btn" class="text-sm bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded transition shadow-sm flex items-center gap-1 border border-red-200">
                            <i class="fas fa-trash-alt"></i> Clear All
                        </button>
                    </div>
                </div>

                <!-- Search/Filter -->
                <div class="mb-4 relative">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="search-inventory" placeholder="Search inventory..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <!-- Inventory Table/List -->
                <div class="overflow-x-auto border rounded-lg flex-grow">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 border-b">
                            <tr>
                                <th class="p-3 text-xs font-medium text-gray-500 uppercase tracking-wider">Item / Barcode</th>
                                <th class="p-3 text-xs font-medium text-gray-500 uppercase tracking-wider text-center w-24">Qty</th>
                                <th class="p-3 text-xs font-medium text-gray-500 uppercase tracking-wider text-right w-20">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-list" class="divide-y divide-gray-200 bg-white">
                            <!-- Inventory items will be injected here via JavaScript -->
                            <tr>
                                <td colspan="3" class="p-4 text-center text-gray-500 italic">Inventory is loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Summary Stats -->
                <div class="mt-4 pt-4 border-t text-sm text-gray-600 flex justify-between">
                    <span>Total Unique Items: <strong id="total-unique-items">0</strong></span>
                    <span>Total Quantity: <strong id="total-quantity">0</strong></span>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal for adding/editing item details -->
    <div id="item-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 transform transition-all scale-95 opacity-0" id="item-modal-content">
            <h3 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2" id="modal-title">Item Details</h3>
            
            <form id="item-details-form" class="space-y-4">
                <input type="hidden" id="modal-original-barcode">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Barcode / ID</label>
                    <input type="text" id="modal-barcode" class="w-full p-2 bg-gray-100 border border-gray-300 rounded-md font-mono text-sm" readonly>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Item Name <span class="text-red-500">*</span></label>
                    <input type="text" id="modal-name" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none" required placeholder="e.g., #2 Pencils (12-pack)">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category (Optional)</label>
                    <input type="text" id="modal-category" list="category-options" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g., Supplies, Apparel, Snacks">
                    <datalist id="category-options">
                        <option value="Supplies">
                        <option value="Apparel">
                        <option value="Snacks">
                        <option value="Electronics">
                    </datalist>
                </div>

                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
                        <div class="flex items-center">
                            <button type="button" id="modal-qty-minus" class="px-3 py-2 bg-gray-200 border border-gray-300 rounded-l-md hover:bg-gray-300">-</button>
                            <input type="number" id="modal-qty" class="w-full p-2 border-y border-gray-300 text-center focus:outline-none" min="1" required>
                            <button type="button" id="modal-qty-plus" class="px-3 py-2 bg-gray-200 border border-gray-300 rounded-r-md hover:bg-gray-300">+</button>
                        </div>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Price ($) (Opt)</label>
                        <input type="number" id="modal-price" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none" min="0" step="0.01" placeholder="0.00">
                    </div>
                </div>

                <div class="mt-6 flex justify-end gap-2 pt-4 border-t">
                    <button type="button" id="modal-cancel" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition shadow-sm">Save Details</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Message goes here</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Setup Environment Variables provided by the hosting context
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'school-store-default';
        const firebaseConfig = {
  apiKey: "AIzaSyC3Z7qr7OUx_8gY4sz-SN324mbmcwpcCt4",
  authDomain: "school-store-db-e2ace.firebaseapp.com",
  projectId: "school-store-db-e2ace",
  storageBucket: "school-store-db-e2ace.firebasestorage.app",
  messagingSenderId: "838354562801",
  appId: "1:838354562801:web:0715be7bfda084c66b4350"
};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // --- State Management ---
        let inventory = {};
        let html5QrcodeScanner = null;
        let isScannerRunning = false;
        
        // Cloud Database State
        let db = null;
        let auth = null;
        let currentUser = null;

        // --- Utility Functions ---
        function showToast(message, duration = 3000) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "toast show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, duration);
        }

        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.value = 800; // Hz
                
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); // Volume
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } catch (e) {
                console.log("Audio not supported or permitted");
            }
        }

        // --- Cloud Sync Initialization ---
        if (firebaseConfig) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            const initAuth = async () => {
                try {
                    if (initialAuthToken) {
                        await signInWithCustomToken(auth, initialAuthToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (e) {
                    console.error("Auth error", e);
                    showToast("Cloud connection failed.");
                }
            };
            initAuth();

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                const statusIcon = document.getElementById('cloud-status');
                if (user) {
                    statusIcon.innerHTML = '<i class="fas fa-cloud text-green-300" title="Connected to Cloud (Live)"></i>';
                    setupRealtimeSync();
                } else {
                    statusIcon.innerHTML = '<i class="fas fa-cloud-slash text-red-300" title="Disconnected"></i>';
                }
            });
        } else {
            document.getElementById('cloud-status').innerHTML = '<i class="fas fa-exclamation-triangle text-yellow-300" title="No DB config"></i>';
        }

        function setupRealtimeSync() {
            if (!currentUser || !db) return;
            // Listen to the shared public inventory collection for this specific app
            const inventoryRef = collection(db, 'artifacts', appId, 'public', 'data', 'inventory');
            
            onSnapshot(inventoryRef, (snapshot) => {
                inventory = {}; // reset local state
                snapshot.forEach((docSnap) => {
                    inventory[docSnap.id] = docSnap.data();
                });
                renderInventory();
            }, (error) => {
                console.error("Real-time sync error:", error);
                showToast("Disconnected from live updates.");
            });
        }

        // --- Inventory Core Logic ---

        // Handle a successfully scanned or manually entered code
        async function handleBarcodeResult(decodedText) {
            playBeep();
            
            // Show feedback in UI
            const feedbackEl = document.getElementById('scan-feedback');
            const codeEl = document.getElementById('last-scanned-code');
            codeEl.textContent = `Scanned: ${decodedText}`;
            feedbackEl.classList.remove('hidden');
            
            setTimeout(() => {
                feedbackEl.classList.add('hidden');
            }, 3000);

            if (!currentUser || !db) {
                showToast("Not connected to cloud DB.");
                return;
            }

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'inventory', decodedText);
            
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    // Item exists, increment quantity
                    await updateDoc(docRef, {
                        qty: docSnap.data().qty + 1,
                        lastUpdated: new Date().toISOString()
                    });
                    showToast(`Increased quantity for ${docSnap.data().name || decodedText}`);
                } else {
                    // New item
                    const newItemData = {
                        name: '', // Empty initially, prompt user to fill
                        qty: 1,
                        category: '',
                        price: 0,
                        dateAdded: new Date().toISOString(),
                        lastUpdated: new Date().toISOString()
                    };
                    
                    // Add it locally immediately so modal can open, then save to cloud
                    inventory[decodedText] = newItemData; 
                    await setDoc(docRef, newItemData);
                    
                    showToast(`New item added: ${decodedText}`);
                    openItemModal(decodedText);
                }
            } catch (error) {
                console.error("Error saving scan:", error);
                showToast("Failed to save scan to cloud.");
            }
        }

        async function deleteItem(barcode) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4';
            overlay.innerHTML = `
                <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full">
                    <h3 class="text-lg font-bold text-red-600 mb-2">Confirm Delete</h3>
                    <p class="text-gray-700 mb-4">Are you sure you want to remove this item completely from the shared inventory?</p>
                    <div class="flex justify-end gap-2">
                        <button id="cancel-del" class="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
                        <button id="confirm-del" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">Delete</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            
            document.getElementById('cancel-del').onclick = () => overlay.remove();
            document.getElementById('confirm-del').onclick = async () => {
                overlay.remove();
                if (!currentUser || !db) return;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'inventory', barcode);
                    await deleteDoc(docRef);
                    showToast("Item removed across all devices");
                } catch (e) {
                    showToast("Failed to delete item.");
                }
            };
        }

        async function adjustQuantity(barcode, delta) {
            if (!currentUser || !db || !inventory[barcode]) return;
            
            const newQty = inventory[barcode].qty + delta;
            const finalQty = Math.max(0, newQty); // Prevent negative stock
            
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'inventory', barcode);
                await updateDoc(docRef, {
                    qty: finalQty,
                    lastUpdated: new Date().toISOString()
                });
            } catch (e) {
                showToast("Failed to update quantity.");
            }
        }

        // --- UI Rendering ---
        function renderInventory() {
            const listEl = document.getElementById('inventory-list');
            const searchTerm = document.getElementById('search-inventory').value.toLowerCase();
            
            listEl.innerHTML = '';
            
            let totalUnique = 0;
            let totalQty = 0;

            const entries = Object.entries(inventory);
            
            if (entries.length === 0) {
                listEl.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-gray-500">
                    <i class="fas fa-box-open text-3xl mb-2 block text-gray-300"></i>
                    Inventory is empty. Start scanning to add items.
                </td></tr>`;
            } else {
                // Filter and sort (newest updated first)
                const filteredEntries = entries
                    .filter(([barcode, data]) => {
                        const searchString = `${barcode} ${data.name || ''} ${data.category || ''}`.toLowerCase();
                        return searchString.includes(searchTerm);
                    })
                    .sort((a, b) => new Date(b[1].lastUpdated) - new Date(a[1].lastUpdated));

                if (filteredEntries.length === 0) {
                     listEl.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500">No items match your search.</td></tr>`;
                }

                filteredEntries.forEach(([barcode, data]) => {
                    totalUnique++;
                    totalQty += data.qty;

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-blue-50 transition-colors group';
                    
                    const displayName = data.name ? data.name : `<span class="italic text-gray-400">Unnamed Item</span>`;
                    const displayCategory = data.category ? `<span class="inline-block bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded-full mt-1">${data.category}</span>` : '';
                    const displayPrice = data.price ? `<span class="text-xs text-green-600 font-medium ml-2">$${parseFloat(data.price).toFixed(2)}</span>` : '';

                    tr.innerHTML = `
                        <td class="p-3 border-b">
                            <div class="font-medium text-gray-800 cursor-pointer hover:text-blue-600 edit-trigger" data-barcode="${barcode}">
                                ${displayName} ${displayPrice}
                            </div>
                            <div class="text-xs text-gray-500 font-mono mt-0.5">${barcode}</div>
                            ${displayCategory}
                        </td>
                        <td class="p-3 border-b text-center align-middle">
                            <div class="flex items-center justify-center bg-gray-100 rounded-md overflow-hidden border border-gray-200 inline-flex">
                                <button class="qty-btn-minus px-2 py-1 text-gray-600 hover:bg-gray-200 hover:text-gray-900 transition" data-barcode="${barcode}">-</button>
                                <span class="w-8 text-center font-semibold text-gray-800 text-sm">${data.qty}</span>
                                <button class="qty-btn-plus px-2 py-1 text-gray-600 hover:bg-gray-200 hover:text-gray-900 transition" data-barcode="${barcode}">+</button>
                            </div>
                        </td>
                        <td class="p-3 border-b text-right align-middle">
                            <button class="text-blue-500 hover:text-blue-700 p-1.5 edit-trigger transition" data-barcode="${barcode}" title="Edit details">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="text-red-400 hover:text-red-600 p-1.5 del-btn transition" data-barcode="${barcode}" title="Remove item">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    `;
                    listEl.appendChild(tr);
                });
            }

            // Update stats
            document.getElementById('total-unique-items').textContent = totalUnique;
            document.getElementById('total-quantity').textContent = totalQty;

            // Attach event listeners to generated dynamic buttons
            document.querySelectorAll('.qty-btn-minus').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    adjustQuantity(e.target.dataset.barcode, -1);
                });
            });
            document.querySelectorAll('.qty-btn-plus').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    adjustQuantity(e.target.dataset.barcode, 1);
                });
            });
            document.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteItem(e.currentTarget.dataset.barcode);
                });
            });
            document.querySelectorAll('.edit-trigger').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const barcode = e.currentTarget.dataset.barcode || el.closest('tr').querySelector('.edit-trigger').dataset.barcode;
                    openItemModal(barcode);
                });
            });
        }

        // --- Modal Handling ---
        const modal = document.getElementById('item-modal');
        const modalContent = document.getElementById('item-modal-content');
        
        function openItemModal(barcode) {
            const item = inventory[barcode];
            if (!item) return;

            document.getElementById('modal-original-barcode').value = barcode;
            document.getElementById('modal-barcode').value = barcode;
            document.getElementById('modal-name').value = item.name || '';
            document.getElementById('modal-category').value = item.category || '';
            document.getElementById('modal-qty').value = item.qty;
            document.getElementById('modal-price').value = item.price || '';

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);

            if (!item.name) {
                document.getElementById('modal-name').focus();
            }
        }

        function closeItemModal() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200); 
        }

        // Modal Form Submit (Save to Cloud)
        document.getElementById('item-details-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const barcode = document.getElementById('modal-original-barcode').value;
            
            if (currentUser && db && inventory[barcode]) {
                const priceVal = document.getElementById('modal-price').value;
                const updates = {
                    name: document.getElementById('modal-name').value,
                    category: document.getElementById('modal-category').value,
                    qty: parseInt(document.getElementById('modal-qty').value, 10),
                    price: priceVal ? parseFloat(priceVal) : 0,
                    lastUpdated: new Date().toISOString()
                };

                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'inventory', barcode);
                    await updateDoc(docRef, updates);
                    showToast("Item details saved globally");
                    closeItemModal();
                } catch (error) {
                    showToast("Failed to save updates.");
                }
            }
        });

        document.getElementById('modal-cancel').addEventListener('click', closeItemModal);
        
        document.getElementById('modal-qty-minus').addEventListener('click', () => {
            const input = document.getElementById('modal-qty');
            if (input.value > 0) input.value = parseInt(input.value) - 1;
        });
        document.getElementById('modal-qty-plus').addEventListener('click', () => {
            const input = document.getElementById('modal-qty');
            input.value = parseInt(input.value) + 1;
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeItemModal();
        });

        // --- Export to CSV ---
        function exportToCSV() {
            if (Object.keys(inventory).length === 0) {
                showToast("Inventory is empty");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Barcode,Item Name,Category,Quantity,Price,Last Updated\n";

            for (const [barcode, data] of Object.entries(inventory)) {
                const name = `"${(data.name || '').replace(/"/g, '""')}"`;
                const category = `"${(data.category || '').replace(/"/g, '""')}"`;
                const date = new Date(data.lastUpdated).toLocaleDateString();
                
                const row = `${barcode},${name},${category},${data.qty},${data.price || 0},${date}`;
                csvContent += row + "\n";
            }

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            
            const dateStr = new Date().toISOString().split('T')[0];
            link.setAttribute("download", `school_store_inventory_${dateStr}.csv`);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("CSV Exported!");
        }

        document.getElementById('export-csv-btn').addEventListener('click', exportToCSV);

        // --- Clear All (Cloud) ---
        document.getElementById('clear-all-btn').addEventListener('click', () => {
             const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4 backdrop-blur-sm';
            overlay.innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full border-t-4 border-red-500">
                    <div class="flex items-center gap-3 mb-4 text-red-600">
                        <i class="fas fa-exclamation-triangle text-3xl"></i>
                        <h3 class="text-xl font-bold">Wipe Cloud Inventory?</h3>
                    </div>
                    <p class="text-gray-700 mb-6">This action will permanently delete ALL items from the shared database for ALL users. This cannot be undone.</p>
                    <div class="flex justify-end gap-3">
                        <button id="cancel-wipe" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-100 font-medium">Cancel</button>
                        <button id="confirm-wipe" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 font-medium shadow-md">Yes, Wipe Data</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            
            document.getElementById('cancel-wipe').onclick = () => overlay.remove();
            document.getElementById('confirm-wipe').onclick = async () => {
                overlay.remove();
                if (!currentUser || !db) return;
                
                showToast("Wiping database...", 5000);
                const keys = Object.keys(inventory);
                
                // Delete docs one by one
                for (const key of keys) {
                    try {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'inventory', key);
                        await deleteDoc(docRef);
                    } catch (e) {
                        console.error("Error deleting", key);
                    }
                }
                showToast("Database cleared!");
            };
        });

        // Search listener
        document.getElementById('search-inventory').addEventListener('input', renderInventory);

        // Manual entry form
        document.getElementById('manual-add-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('manual-barcode');
            const val = input.value.trim();
            if (val) {
                handleBarcodeResult(val);
                input.value = '';
            }
        });

        // --- Barcode Scanner Setup ---
        function onScanSuccess(decodedText, decodedResult) {
            if (isScannerRunning) {
                handleBarcodeResult(decodedText);
            }
        }

        function onScanFailure(error) {
            // Ignored to allow continuous scanning
        }

        function startScanner() {
            const btn = document.getElementById('toggle-camera-btn');
            
            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5Qrcode("reader");
            }

            if (isScannerRunning) {
                html5QrcodeScanner.stop().then((ignore) => {
                    isScannerRunning = false;
                    btn.innerHTML = '<i class="fas fa-play mr-1"></i> Start Camera';
                    btn.classList.replace('bg-red-100', 'bg-gray-100');
                    btn.classList.replace('text-red-700', 'text-gray-700');
                }).catch((err) => {
                    showToast("Error stopping camera");
                });
            } else {
                const config = { fps: 10, qrbox: { width: 250, height: 150 } };
                
                html5QrcodeScanner.start(
                    { facingMode: "environment" }, 
                    config, 
                    onScanSuccess, 
                    onScanFailure
                ).then(() => {
                    isScannerRunning = true;
                    btn.innerHTML = '<i class="fas fa-stop mr-1"></i> Stop Camera';
                    btn.classList.replace('bg-gray-100', 'bg-red-100');
                    btn.classList.replace('text-gray-700', 'text-red-700');
                }).catch((err) => {
                    console.error("Camera start error:", err);
                    showToast("Camera access denied or unavailable.");
                });
            }
        }

        document.getElementById('toggle-camera-btn').addEventListener('click', startScanner);

        // --- Navigation Logic ---
        const viewScanner = document.getElementById('view-scanner');
        const viewInventory = document.getElementById('view-inventory');
        const navScanner = document.getElementById('nav-scanner');
        const navInventory = document.getElementById('nav-inventory');

        function switchView(view) {
            if (view === 'scanner') {
                viewScanner.classList.remove('hidden');
                viewScanner.classList.add('flex');
                viewInventory.classList.add('hidden');
                viewInventory.classList.remove('flex');
                
                navScanner.classList.replace('bg-blue-500', 'bg-blue-700');
                navInventory.classList.replace('bg-blue-700', 'bg-blue-500');
            } else {
                viewScanner.classList.add('hidden');
                viewScanner.classList.remove('flex');
                viewInventory.classList.remove('hidden');
                viewInventory.classList.add('flex');
                
                navInventory.classList.replace('bg-blue-500', 'bg-blue-700');
                navScanner.classList.replace('bg-blue-700', 'bg-blue-500');
                
                if (isScannerRunning && html5QrcodeScanner) {
                    startScanner(); // Stop camera
                }
            }
        }

        navScanner.addEventListener('click', () => switchView('scanner'));
        navInventory.addEventListener('click', () => switchView('inventory'));

        // Load empty state initially, Firebase listener will populate it
        window.addEventListener('DOMContentLoaded', () => {
            renderInventory(); 
        });
    </script>
</body>
</html>
