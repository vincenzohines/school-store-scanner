<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>PBIS Store Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20 font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-blue-700 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-10">
        <h1 class="text-xl font-bold">PBIS Store Scanner</h1>
        <div id="cloudStatus" class="text-yellow-300" title="Connecting to Cloud...">
            <i class="fas fa-cloud text-xl"></i>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto">
        <!-- Scanner Area -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-6">
            <div id="reader" class="w-full rounded overflow-hidden mb-4 bg-black"></div>
            <button id="startScanBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors text-lg flex justify-center items-center">
                <i class="fas fa-camera mr-2"></i> Start Scanner
            </button>
        </div>

        <!-- Manual Entry -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-6">
            <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-3">Manual Entry</h2>
            <div class="flex gap-2">
                <input type="text" id="manualBarcode" placeholder="Enter barcode manually..." class="flex-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                <button id="manualSubmitBtn" class="bg-gray-800 hover:bg-gray-900 text-white px-5 py-3 rounded-lg font-semibold transition-colors">Add</button>
            </div>
        </div>

        <!-- Inventory List -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider">Current Inventory</h2>
                <button id="exportBtn" class="text-xs text-blue-700 hover:text-blue-900 bg-blue-100 hover:bg-blue-200 px-3 py-1.5 rounded font-semibold transition-colors">
                    <i class="fas fa-download mr-1"></i> CSV
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-white text-xs text-gray-400 border-b">
                            <th class="p-3 font-semibold">Item Details</th>
                            <th class="p-3 font-semibold text-right">Points</th>
                            <th class="p-3 font-semibold text-center">Qty</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryList" class="text-sm divide-y divide-gray-100 bg-white">
                        <!-- Items populate here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- New Item Modal -->
    <div id="itemModal" class="fixed inset-0 bg-gray-900 bg-opacity-75 hidden items-center justify-center p-4 z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <div class="flex items-center text-blue-600 mb-4">
                <i class="fas fa-plus-circle text-2xl mr-2"></i>
                <h2 class="text-xl font-bold text-gray-800">New Item Scanned</h2>
            </div>
            <p class="text-sm text-gray-500 mb-5 pb-4 border-b border-gray-100">Barcode: <span id="modalBarcodeDisplay" class="font-mono font-bold text-gray-800 bg-gray-100 px-2 py-1 rounded"></span></p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Reward Name</label>
                    <input type="text" id="itemName" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="e.g. Takis, Notebook">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Category</label>
                    <input type="text" id="itemCategory" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="e.g. Snacks, Supplies">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Points Value</label>
                    <input type="number" id="itemPoints" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-lg font-bold text-blue-600" placeholder="0">
                </div>
            </div>

            <div class="mt-8 flex gap-3">
                <button id="cancelModalBtn" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-lg font-bold transition-colors">Cancel</button>
                <button id="saveItemBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold shadow-md transition-colors">Save Reward</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50 font-medium text-sm flex items-center">
        <i class="fas fa-info-circle mr-2 text-blue-400"></i>
        <span id="toastMsg">Message</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your specific database configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC3Z7qr7OUx_8gY4sz-SN324mbmcwpcCt4",
            authDomain: "school-store-db-e2ace.firebaseapp.com",
            projectId: "school-store-db-e2ace",
            storageBucket: "school-store-db-e2ace.firebasestorage.app",
            messagingSenderId: "838354562801",
            appId: "1:838354562801:web:0715be7bfda084c66b4350"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State
        let scanner = null;
        let isScanning = false;
        let currentBarcode = null;
        let inventoryData = {};

        // DOM Elements
        const cloudStatus = document.getElementById('cloudStatus');
        const inventoryList = document.getElementById('inventoryList');
        const startScanBtn = document.getElementById('startScanBtn');
        const modal = document.getElementById('itemModal');
        
        // --- Authentication & DB Sync ---
        signInAnonymously(auth).catch((error) => {
            showToast("Auth Error: " + error.message);
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                cloudStatus.className = "text-green-400";
                cloudStatus.title = "Database Synced";
                
                onSnapshot(collection(db, "inventory"), (snapshot) => {
                    inventoryData = {};
                    snapshot.forEach((doc) => {
                        inventoryData[doc.id] = doc.data();
                    });
                    renderInventory();
                }, (error) => {
                    cloudStatus.className = "text-red-400";
                    showToast("Sync Error! Check your internet.");
                });
            } else {
                cloudStatus.className = "text-yellow-300";
            }
        });

        // --- Core Functions ---
        async function processBarcode(barcode) {
            if (isScanning && scanner) {
                scanner.pause(true);
            }

            try {
                const docRef = doc(db, "inventory", barcode);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    await setDoc(docRef, {
                        ...data,
                        quantity: data.quantity + 1,
                        lastUpdated: new Date().toISOString()
                    });
                    showToast(`+1 ${data.name} added!`);
                    if (isScanning && scanner) scanner.resume();
                } else {
                    currentBarcode = barcode;
                    document.getElementById('modalBarcodeDisplay').textContent = barcode;
                    document.getElementById('itemName').value = '';
                    document.getElementById('itemCategory').value = '';
                    document.getElementById('itemPoints').value = '';
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                }
            } catch (err) {
                showToast("Error checking database.");
                if (isScanning && scanner) scanner.resume();
            }
        }

        // --- Event Listeners ---
        document.getElementById('saveItemBtn').addEventListener('click', async () => {
            const name = document.getElementById('itemName').value || "Unnamed Reward";
            const category = document.getElementById('itemCategory').value || "Misc";
            const points = parseInt(document.getElementById('itemPoints').value) || 0;

            await setDoc(doc(db, "inventory", currentBarcode), {
                barcode: currentBarcode,
                name: name,
                category: category,
                points: points,
                quantity: 1,
                lastUpdated: new Date().toISOString()
            });

            modal.classList.add('hidden');
            modal.classList.remove('flex');
            showToast("Reward saved!");
            if (isScanning && scanner) scanner.resume();
        });

        document.getElementById('cancelModalBtn').addEventListener('click', () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            if (isScanning && scanner) scanner.resume();
        });

        document.getElementById('manualSubmitBtn').addEventListener('click', () => {
            const input = document.getElementById('manualBarcode');
            const code = input.value.trim();
            if (code) {
                processBarcode(code);
                input.value = '';
            }
        });

        startScanBtn.addEventListener('click', () => {
            if (!isScanning) {
                scanner = new Html5Qrcode("reader");
                const config = { fps: 10, qrbox: { width: 250, height: 150 } };
                
                scanner.start({ facingMode: "environment" }, config, (decodedText) => {
                    processBarcode(decodedText);
                }).then(() => {
                    isScanning = true;
                    startScanBtn.innerHTML = '<i class="fas fa-stop mr-2"></i> Stop Scanner';
                    startScanBtn.classList.replace('bg-blue-600', 'bg-red-500');
                    startScanBtn.classList.replace('hover:bg-blue-700', 'hover:bg-red-600');
                }).catch(err => {
                    showToast("Camera access denied or error.");
                });
            } else {
                scanner.stop().then(() => {
                    isScanning = false;
                    startScanBtn.innerHTML = '<i class="fas fa-camera mr-2"></i> Start Scanner';
                    startScanBtn.classList.replace('bg-red-500', 'bg-blue-600');
                    startScanBtn.classList.replace('hover:bg-red-600', 'hover:bg-blue-700');
                });
            }
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            const headers = ["Barcode", "Name", "Category", "Points", "Quantity"];
            let csvContent = headers.join(",") + "\\n";
            
            Object.values(inventoryData).forEach(item => {
                const row = [
                    item.barcode,
                    `"${item.name}"`,
                    `"${item.category}"`,
                    item.points,
                    item.quantity
                ];
                csvContent += row.join(",") + "\\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "PBIS_Reward_Inventory.csv";
            link.click();
        });

        function renderInventory() {
            inventoryList.innerHTML = '';
            const items = Object.values(inventoryData).sort((a, b) => b.lastUpdated?.localeCompare(a.lastUpdated));
            
            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3">
                        <div class="font-bold text-gray-800">${item.name}</div>
                        <div class="text-xs text-gray-400 font-mono mt-0.5">${item.barcode}</div>
                    </td>
                    <td class="p-3 text-right">
                        <span class="bg-blue-50 text-blue-700 px-2 py-1 rounded font-bold text-sm">${item.points} pts</span>
                    </td>
                    <td class="p-3 text-center">
                        <span class="font-bold text-gray-800 text-lg">${item.quantity}</span>
                    </td>
                `;
                inventoryList.appendChild(tr);
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
